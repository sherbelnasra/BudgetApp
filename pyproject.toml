[project]
name = "stock-picker"
version = "1.1.0"
description = "Scalping dashboard, 150-MA picks, and iOS monthly call-option alerts"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "streamlit>=1.32.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
stock-picker = "stock_picker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
