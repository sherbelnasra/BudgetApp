requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "streamlit>=1.32.0",
    "jinja2>=3.1.0",
]

[project.scripts]
stock-picker = "stock_picker.cli:main"
