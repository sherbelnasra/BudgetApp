name: CallAlert
options:
  bundleIdPrefix: com.stockpicker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1"
  SWIFT_VERSION: "5.0"
targets:
  CallAlert:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.stockpicker.CallAlert
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_FILE: false
      PRODUCT_NAME: CallAlert
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
